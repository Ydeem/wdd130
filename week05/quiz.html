<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML &amp; CSS Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <h1>HTML &amp; CSS Quick Quiz</h1>
    <form action="#" method="get">
        <div class="form-group">
            <label for="q1">1. Which HTML element is used to link an external CSS file to a page? (just the tag name)</label>
            <input type="text" id="q1" name="q1" placeholder="e.g. link">
        </div>

        <div class="form-group">
            <label for="q2">2. In your own words, explain the difference between an HTML "id" attribute and a "class" attribute.</label>
            <textarea id="q2" name="q2" rows="4"></textarea>
        </div>

        <div class="form-group">
            <label for="q3">3. Which CSS display value arranges child elements in a row-and-column grid?</label>
            <select id="q3" name="q3">
                <option value="" selected disabled>Choose One ...</option>
                <option value="flex">flex</option>
                <option value="grid">grid</option>
                <option value="block">block</option>
                <option value="inline">inline</option>
            </select>
        </div>

        <div class="form-group">
            <label for="q4">4. How many sides does a CSS box model have padding on (top, right, bottom, left)?</label>
            <input type="number" id="q4" name="q4" min="0" max="10">
        </div>

        <button type="submit">Submit Quiz</button>
    </form>
</body>

</html>
