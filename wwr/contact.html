<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Contact Us | Wild River Rafting Co.</title>
<meta name="description" content="Contact Wild River Rafting Co. — find our address, phone number, and email, or send us a message using the form below.">
<meta name="author" content="David Wilson">
<link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
<header>
<img src="images/wwr-logo.svg" alt="Wild River Rafting Co. logo" width="80" height="80">
<nav>
<a href="index.html">Home</a>
<a href="about.html">About Us</a>
<a href="trips.html">Trips</a>
<a href="contact.html">Contact Us</a>
</nav>
</header>
<main>
<section class="contact-intro">
<h1>Wild River Rafting Co.</h1>
<address>
123 Main River Street<br>
Kolob, California<br>
<a href="tel:+19999999999">+1 999 999 9999</a><br>
<a href="mailto:info@wildriverrafting.com">info@wildriverrafting.com</a>
</address>
</section>
<section class="contact-main">
<div class="map-wrap">
<iframe title="Wild River Rafting Co. location map" src="https://www.google.com/maps?q=123+Main+River+Street,+Kolob,+California&output=embed" width="600" height="300" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
</div>
<form class="contact-form" action="#" method="get">
<div class="form-row">
<label for="name">Name</label>
<input type="text" id="name" name="name" placeholder="Your full name" required>
</div>
<div class="form-row">
<label for="email">Email</label>
<input type="email" id="email" name="email" placeholder="you@example.com" required>
</div>
<fieldset class="message-purpose">
<legend>Message Purpose</legend>
<label><input type="radio" name="purpose" value="general" checked> General Inquiry</label>
<label><input type="radio" name="purpose" value="reservation"> Reservation Question</label>
<label><input type="radio" name="purpose" value="suggestion"> Website Suggestion</label>
</fieldset>
<div class="form-row">
<label for="message">Message</label>
<textarea id="message" name="message" rows="5" placeholder="Type here"></textarea>
</div>
<label class="newsletter">
<input type="checkbox" name="newsletter" id="newsletter">
Please subscribe me to the monthly newsletter
</label>
<button type="submit">Get in Touch!</button>
</form>
</section>
<section class="employees">
<h2>We Are Here to Serve You</h2>
<div class="employee-grid">
<figure>
<img src="images/employee-1.svg" alt="Portrait of Maria Alvarez">
<figcaption>Maria Alvarez<br>Lead River Guide</figcaption>
</figure>
<figure>
<img src="images/employee-2.svg" alt="Portrait of Jordan Kim">
<figcaption>Jordan Kim<br>Trip Coordinator</figcaption>
</figure>
<figure>
<img src="images/employee-3.svg" alt="Portrait of Samuel Otieno">
<figcaption>Samuel Otieno<br>Safety Officer</figcaption>
</figure>
</div>
</section>
</main>
<footer>
<p>&copy;2026 Wild River Rafting Co. &bull; David Wilson</p>
<nav class="socialmedia">
<a href="https://instagram.com" target="_blank" rel="noopener"><img src="images/social-camera.svg" alt="Wild River Rafting Co. on Instagram"></a>
<a href="https://facebook.com" target="_blank" rel="noopener"><img src="images/social-chat.svg" alt="Wild River Rafting Co. on Facebook"></a>
<a href="https://twitter.com" target="_blank" rel="noopener"><img src="images/social-share.svg" alt="Wild River Rafting Co. on Twitter"></a>
</nav>
</footer>
</body>
</html>
